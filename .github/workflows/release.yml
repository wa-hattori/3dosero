name: Create GitHub Release

# v* 形式のタグをpushするたびに、GitHub Releaseを自動作成する。
# 「リリースノートを必ず付与する」運用(.claude/rules/common/git-workflow.md
# の「リリースノート」節)を、人手の手順に頼らず構造的に保証するための自動化。
# ノートは直前のタグからの変更をGitHubが自動生成する(--generate-notes)。
# より詳しい説明にしたい場合は、作成後に手動で編集してよい
# (.claude/skills/release-tagging/SKILL.md 参照)。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # --generate-notes が直前のタグとの差分を計算できるよう全履歴を取得する。
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
