name: Build and Release iOS App

# 正本: .claude/skills/ios-native-packaging/SKILL.md
#
# 他の2つ(deploy.yml/release.yml)と同じ v* タグpushでも起動するが、
# それに加えて workflow_dispatch(GitHub UIの「Run workflow」ボタン、任意の
# ブランチ/タグを選べる)でも手動起動できる。ローカルMacでのXcodeデバッグを
# 前提にできない場合(手元のMacで最新Xcodeが入らない等)、動作確認は
# 「このワークフローを手動起動 → TestFlightでビルドをインストールして実機確認」
# がCI-onlyの主経路になる(ios-app/README.md参照)。
#
# どちらのトリガーでも、`app-store-release` Environmentの「Required
# reviewers」承認ゲートにより、実際のジョブ実行前に人間の承認を必須にする
# (App Store提出はビルド番号を消費し、Web公開ほど気軽には取り消せないため)。
# このEnvironment保護ルールの設定はGitHub Web UI側での1回限りの手動作業。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    environment:
      name: app-store-release
    defaults:
      run:
        working-directory: ios-app
    steps:
      # uses: ステップは defaults.run.working-directory の影響を受けないため
      # (それが効くのは run: ステップだけ)、checkoutはそのままリポジトリルートに展開される。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # マーケティングバージョンはpackage.jsonの値をそのまま使う(タグpushなら
      # そのタグ時点の値、workflow_dispatchでの手動起動なら選んだブランチの
      # 現在値になる。どちらのトリガーでも同じロジックで求まる)。
      # ビルド番号はワークフロー単位で単調増加するrun_numberを使う。
      - name: Derive version numbers
        working-directory: .
        run: |
          echo "MARKETING_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Stage web assets (offline bundling)
        working-directory: .
        run: ./scripts/stage-web-assets.sh ios-app/www

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync web assets into the Xcode project
        run: npx cap sync ios

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios-app

      - name: Build, sign, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: bundle exec fastlane release
