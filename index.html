<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3dosero — 立体オセロ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
    }

    #board-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #f4f4f4;
    }

    #ui-overlay > * {
      pointer-events: auto;
    }

    .status-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 1rem;
    }

    .layer-control {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.9rem;
    }

    .layer-control span {
      min-width: 3.5em;
      text-align: center;
    }

    .layer-control input[type='range'] {
      width: 220px;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #111318;
      text-align: center;
    }

    .start-screen h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.05em;
    }

    .start-screen p {
      margin: 0;
      opacity: 0.75;
    }

    .start-screen-modes {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .start-screen-modes button {
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .start-screen-modes button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="board-canvas"></canvas>
  <div id="ui-overlay"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
