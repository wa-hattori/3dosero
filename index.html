<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3dosero — 立体オセロ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
    }

    #hero-canvas,
    #board-canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #f4f4f4;
    }

    #ui-overlay > * {
      pointer-events: auto;
    }

    .status-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 1rem;
    }

    .status-panel--pass-flash {
      animation: pass-flash 900ms ease-out;
    }

    @keyframes pass-flash {
      0% {
        background: rgba(255, 196, 0, 0.85);
        transform: scale(1.08);
      }
      100% {
        background: rgba(0, 0, 0, 0.5);
        transform: scale(1);
      }
    }

    .layer-control {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.9rem;
    }

    .layer-control span {
      min-width: 3.5em;
      text-align: center;
    }

    .layer-control input[type='range'] {
      width: 220px;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: transparent;
      text-align: center;
    }

    /* 背景は透過してhero-canvasの3D装飾を見せるため、この要素自体は
       ポインタイベントを素通しする。`#ui-overlay > *` (pointer-events: auto) より
       詳細度を上げるため `#ui-overlay > .start-screen` で上書きする。
       ボタン類にだけ個別に auto を戻し、それ以外の領域でのドラッグが
       hero-canvasのOrbitControlsに届くようにする。 */
    #ui-overlay > .start-screen {
      pointer-events: none;
    }

    .start-screen-modes button,
    .start-screen-back {
      pointer-events: auto;
    }

    .start-screen h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      text-shadow: 0 0 24px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .start-screen p {
      margin: 0;
      opacity: 0.85;
      text-shadow: 0 0 16px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .start-screen-modes {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .start-screen-modes button {
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      backdrop-filter: blur(2px);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .start-screen-modes button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .start-screen-modes button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .start-screen-modes button:disabled:hover {
      background: rgba(10, 12, 18, 0.55);
    }

    .start-screen-back {
      margin-top: 8px;
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: inherit;
      opacity: 0.7;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }

    .start-screen-back:hover {
      opacity: 1;
    }

    .end-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(17, 19, 24, 0.85);
      text-align: center;
    }

    .end-screen h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.05em;
    }

    .end-screen p {
      margin: 0;
      font-size: 1.2rem;
      opacity: 0.85;
    }

    .end-screen button {
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .end-screen button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .mute-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      color: inherit;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
    }

    .mute-toggle:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .title-button {
      position: absolute;
      top: 64px;
      right: 16px;
      z-index: 10;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      color: inherit;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }

    .title-button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.wasm.bundle.min.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="board-canvas"></canvas>
  <canvas id="hero-canvas"></canvas>
  <div id="ui-overlay"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
