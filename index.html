<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3dosero — 立体オセロ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
    }

    #hero-canvas,
    #board-canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #f4f4f4;
    }

    #ui-overlay > * {
      pointer-events: auto;
    }

    .status-panel {
      position: absolute;
      /* iPhoneのノッチ/Dynamic Island・ステータスバーと重ならないよう、
         セーフエリア分だけ余分にオフセットする(viewport-fit=coverと対）。 */
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 1rem;
    }

    .status-panel--pass-flash {
      animation: pass-flash 900ms ease-out;
    }

    @keyframes pass-flash {
      0% {
        background: rgba(255, 196, 0, 0.85);
        transform: scale(1.08);
      }
      100% {
        background: rgba(0, 0, 0, 0.5);
        transform: scale(1);
      }
    }

    /* オンライン対戦の一手タイマー・持ち時間表示。status-panelの下に並べる。 */
    .game-timer-panel {
      position: absolute;
      top: calc(76px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .game-timer-row {
      opacity: 0.7;
    }

    .game-timer-row--active {
      opacity: 1;
      font-weight: 700;
      color: #ffd452;
    }

    .layer-control {
      position: absolute;
      /* iPhoneのホームインジケータと重ならないようセーフエリア分オフセットする。 */
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.9rem;
    }

    .layer-control span {
      min-width: 3.5em;
      text-align: center;
    }

    .layer-control input[type='range'] {
      width: 220px;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: transparent;
      text-align: center;
    }

    /* 背景は透過してhero-canvasの3D装飾を見せるため、この要素自体は
       ポインタイベントを素通しする。`#ui-overlay > *` (pointer-events: auto) より
       詳細度を上げるため `#ui-overlay > .start-screen` で上書きする。
       ボタン類にだけ個別に auto を戻し、それ以外の領域でのドラッグが
       hero-canvasのOrbitControlsに届くようにする。 */
    #ui-overlay > .start-screen {
      pointer-events: none;
    }

    .start-screen-modes button,
    .start-screen-modes input,
    .start-screen-back {
      pointer-events: auto;
    }

    .start-screen h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      text-shadow: 0 0 24px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .start-screen p {
      margin: 0;
      opacity: 0.85;
      text-shadow: 0 0 16px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: pre-line;
    }

    .start-screen-error {
      color: #ff8a8a;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .start-screen-text-input {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      width: 12em;
    }

    .start-screen-room-code-input {
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 0.1em;
      width: 8em;
    }

    .start-screen-modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    .start-screen-modes button {
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      backdrop-filter: blur(2px);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .start-screen-modes button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .start-screen-modes button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .start-screen-modes button:disabled:hover {
      background: rgba(10, 12, 18, 0.55);
    }

    .start-screen-profile-name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 8px 0 0;
      font-size: 1.4rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .start-screen-profile-score {
      margin: 4px 0 0;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .start-screen-ranking-list {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
      max-height: 50vh;
      overflow-y: auto;
      width: min(90vw, 28em);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .start-screen-ranking-row {
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(10, 12, 18, 0.55);
      text-align: left;
      font-size: 0.95rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .start-screen-back {
      margin-top: 8px;
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: inherit;
      opacity: 0.7;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }

    .start-screen-back:hover {
      opacity: 1;
    }

    .vs-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(17, 19, 24, 0.9);
      text-align: center;
    }

    .vs-screen h1 {
      margin: 0 0 4px;
      font-size: 2rem;
      letter-spacing: 0.05em;
    }

    .vs-screen-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .vs-screen-color-label {
      margin: 0;
      opacity: 0.75;
      font-size: 0.9rem;
    }

    .vs-screen-name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 1.3rem;
    }

    .vs-screen-score-line {
      margin: 0;
      opacity: 0.85;
      font-size: 1rem;
    }

    .vs-screen-vs-mark {
      margin: 2px 0;
      font-size: 1.4rem;
      font-weight: 700;
      opacity: 0.6;
    }

    .vs-screen-countdown {
      margin: 8px 0 0;
      opacity: 0.6;
      font-size: 0.85rem;
    }

    .vs-screen button {
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .vs-screen button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .end-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(17, 19, 24, 0.85);
      text-align: center;
    }

    .end-screen h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.05em;
    }

    .end-screen p {
      margin: 0;
      font-size: 1.2rem;
      opacity: 0.85;
    }

    .end-screen button {
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .end-screen button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .score-change-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(17, 19, 24, 0.92);
      text-align: center;
    }

    .score-change-screen h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.05em;
    }

    .score-change-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 1.3rem;
    }

    .score-change-delta {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 700;
    }

    .score-change-delta--up {
      color: #6fe07a;
    }

    .score-change-delta--down {
      color: #ff8a8a;
    }

    .score-change-screen button {
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
    }

    .score-change-screen button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .mute-toggle {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      color: inherit;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
    }

    .mute-toggle:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .title-button {
      position: absolute;
      top: calc(64px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 10;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(10, 12, 18, 0.55);
      color: inherit;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }

    .title-button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* 階級アイコン（コイン型、中央に元素記号）。画像アセットは使わず、
       階級ごとの色はCSSグラデーションのみで表現する（tier-icon.js参照）。 */
    .tier-icon {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 1.8em;
      height: 1.8em;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.8rem;
      line-height: 1;
      vertical-align: middle;
      border: 1px solid rgba(0, 0, 0, 0.35);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.65),
        inset 0 -2px 3px rgba(0, 0, 0, 0.25);
    }

    .tier-icon--iron {
      background: radial-gradient(circle at 35% 30%, #f5f3ee, #d6d2c6 70%);
      color: #4a4740;
    }

    .tier-icon--aluminum {
      background: radial-gradient(circle at 35% 30%, #ffffff, #dfe6ec 70%);
      color: #47535e;
    }

    .tier-icon--bronze {
      background: radial-gradient(circle at 35% 30%, #dd9c5c, #8a5527 70%);
      color: #3a2410;
    }

    .tier-icon--silver {
      background: radial-gradient(circle at 35% 30%, #f2f2f2, #a6a6a6 70%);
      color: #333333;
    }

    .tier-icon--diamond {
      background: radial-gradient(circle at 35% 30%, #8dfff0, #0fa89f 70%);
      color: #04302c;
    }

    .tier-icon--carbon-nanotube {
      background: conic-gradient(
        from 0deg,
        #ff5252,
        #ffb852,
        #e9ff52,
        #52ff7a,
        #52d4ff,
        #7a52ff,
        #ff52d4,
        #ff5252
      );
      color: #14141a;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.85);
    }

    .version-badge {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      padding: 2px 8px;
      opacity: 0.5;
      font-size: 0.75rem;
      font-family: inherit;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.wasm.bundle.min.mjs",
        "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js",
        "@capacitor-community/admob": "https://esm.sh/@capacitor-community/admob@8.1.0"
      }
    }
  </script>
</head>
<body>
  <canvas id="board-canvas"></canvas>
  <canvas id="hero-canvas"></canvas>
  <div id="ui-overlay"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
